services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"
      FRONTEND_ORIGIN: "https://pocketperk-stamp.netlify.app"
      # SEND_MODE and INSTANTLY_AUTO_LAUNCH come from backend/.env; defaults stay safe there.
    ports:
      - "127.0.0.1:8001:8000"
    init: true
    restart: unless-stopped
